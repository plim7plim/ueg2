<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto conjunto</title>
</head>

<body>

    <h1>Programa do Projeto Conjunto</h1>

    <label for="inTamanhoConjunto">
        Digite o tamanho do conjunto:
    </label>

    <br><br>

    <input
        type="text"
        id="idNome"
        placeholder="Digite seu nome"
    >

    <input
        type="number"
        id="inTamanhoConjunto"
        placeholder="Digite o tamanho do conjunto"
    >

    <button
        type="button"
        id="btnEvento"
        onclick="eventoCriarConjunto()"
    >
        Criar conjunto
    </button>

    <hr>


    <h2>Array 1</h2>

    <p id="saidaConjunto"></p>


    <h3>Maior e menor termo do Array</h3>

    <p id="maiorTermo"></p>

    <p id="menorTermo"></p>


    <hr>


    <h2>Array 2</h2>

    <p>
        O Array 2 recebe uma cópia do Array 1:
    </p>

    <p id="saidaVetor2"></p>


    <button
        type="button"
        id="btnEventoBubbleSort"
        onclick="eventoBubbleSort()"
    >
        Ordenar Array 2
    </button>


    <h3>Array 2 ordenado</h3>

    <p id="saidaBubbleSort"></p>


    <hr>


    <h2>Buscas</h2>

    <input
        type="number"
        id="inNumeroBuscado"
        placeholder="Digite o número a ser buscado"
    >

    <br><br>


    <button
        type="button"
        onclick="eventoBuscaSequencial()"
    >
        Busca Sequencial
    </button>


    <button
        type="button"
        onclick="eventoBuscaBinaria()"
    >
        Busca Binária
    </button>


    <h3>Resultado Busca Sequencial</h3>

    <p id="saidaBuscaSequencial"></p>


    <h3>Resultado Busca Binária</h3>

    <p id="saidaBuscaBinaria"></p>


    <script src="tarefa25-08.js"></script>

</body>
</html>
