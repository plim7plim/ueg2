<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica GYN</title>
</head>
<body>
    <h1>Clínica GYN - Cadastro de Paciente</h1> <hr>

    <label for="idNome">Nome completo:</label>
    <input type="text" id="idNome"> <br>

    <label for="idPeso">Peso (kg):</label>
    <input type="number" id="idPeso" step="0.1"> <br>

    <label for="idAltura">Altura (m):</label>
    <input type="number" id="idAltura" step="0.01"> <br>

    <label for="idSexo">Sexo:</label>
    <select id="idSexo">
        <option value="Masculino">Masculino</option>
        <option value="Feminino">Feminino</option>
    </select> <br>

    <button type="button" onclick="cadastrar()">Calcular</button>
    <hr>

    <pre id="saida"></pre>

    <script src="js/paciente.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
