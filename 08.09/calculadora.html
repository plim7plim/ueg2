<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
</head>
<body>
    <h1> Segunda aula de html com JS </h1> <hr>
    <label for="Numero1">Primeiro Número</label> 
    <input type="number" id="Numero1" placeholder="Digite o primeiro número"> <br>

    <label for="Numero2">Segundo Número</label>
    <input type="number" id="Numero2" placeholder="Digite o segundo número"><br>

    <button type="button" id="btnSomar" onclick="somar()">Clique aqui para somar</button> 
    <button type="button" id="btnSubtrair" onclick="subtrair()">Clique aqui para subtrair</button>
    <button type="button" id="btnMultiplicar" onclick="multiplicar()">Clique aqui para multiplicar</button>
    <button type="button" id="btnDividir" onclick="dividir()">Clique aqui para dividir</button> 
    <button type="button" id="btnPotencia" onclick="potencia()">Clique aqui para Potencia</button>
    <button type="button" id="btnRaiz" onclick="raiz()">Clique aqui para Raiz</button>
    <br>
    <br>

    <h1 id="resultado"> </h1> <!--Onde vai aparecer o resultado da operação-->

    <hr>

    <script src="js/calcular.js"></script>
</body>
</html>
