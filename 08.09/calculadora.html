<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <h1> Segunda aula de html com JS </h1> <hr>
    <label for="Numero1">Primeiro Número</label> 
    <input type="number" id="Numero1" placeholder="Digite o primeiro número"> <br>

    <label for="Numero2">Segundo Número</label>
    <input type="number" id="Numero2" placeholder="Digite o segundo número"><br>

    <button type="button" id="btnSomar" onclick="somar()"><b>Clique aqui para somar</b></button> 
    <button type="button" id="btnSubtrair" onclick="subtrair()"><b>Clique aqui para subtrair</b></button>
    <button type="button" id="btnMultiplicar" onclick="multiplicar()"><b>Clique aqui para multiplicar</b></button>
    <button type="button" id="btnDividir" onclick="dividir()"><b>Clique aqui para dividir</b> </button>
    <button type="button" id="btnPotencia" onclick="potencia()"><b>Clique aqui para Potencia</b> </button>
    <button type="button" id="btnRaiz" onclick="raiz()"><b>Clique aqui para Raiz</b> </button>
    <br>
    <br>

    <h1 id="resultado"> </h1> <!--Onde vai aparecer o resultado da operação-->

    <hr>

    <script src="js/calcular.js"></script>
</body>
</html>
